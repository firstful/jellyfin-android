name: build-apk
on:
  push:
    paths:
      - 'app/**'
      - 'app-manifest.yaml'
      - '.gitea/workflows/build-apk.yaml'
      - 'scripts/ci-*.py'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
  workflow_dispatch:

jobs:
  build:
    runs-on: [android]
    container:
      image: cimg/android:2026.07-node
      # --user root: the SDK image needs it for apt/pip.
      # -v gradle-cache: job containers are recreated per run; this persists the
      # gradle home (dist + deps) across jobs. Volume lives in the runner's DinD
      # daemon (docker-vol PVC). NOTE: runner-config container.options is
      # IGNORED when the job sets its own container.options — must repeat here.
      options: --user root -v gradle-cache:/root/.gradle
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml (cimg image lacks it)
        run: |
          python3 -m pip install --quiet pyyaml 2>/dev/null || sudo apt-get install -y -qq python3-yaml >/dev/null
          python3 -c "import yaml; print('pyyaml OK')"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
          chmod 600 /tmp/keystore.jks
          ls -l /tmp/keystore.jks

      - name: Build + sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          JF_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('app-manifest.yaml'))['apk']['extraProps']['jellyfinVersion'])")
          TELEMETRY_URL=$(python3 -c "import yaml; print(yaml.safe_load(open('app-manifest.yaml'))['apk']['extraProps']['telemetryUrl'])")
          ./gradlew assembleProprietaryRelease \
            -Pjellyfin.version="$JF_VERSION" \
            -PtelemetryUrl="$TELEMETRY_URL" \
            -Pkeystore.file=/tmp/keystore.jks \
            -Pkeystore.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Psigning.key.alias="$ANDROID_KEY_ALIAS" \
            -Psigning.key.password="$ANDROID_KEY_PASSWORD"

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs -name "*.apk" -path "*release*" | head -1)
          echo "APK: $APK"
          [ -n "$APK" ] || { echo "no APK found in app/build/outputs"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      - name: Publish to Sutliff Apps store
        env:
          APPSTORE_PUBLISH_TOKEN: ${{ secrets.APPSTORE_PUBLISH_TOKEN }}
          APPSTORE_URL: http://apps.ffilt.us
        run: |
          APK=$(find app/build/outputs -name "*.apk" -path "*release*" | head -1)
          echo "APK: $APK"
          python3 scripts/ci-publish-apk.py "$APK"
