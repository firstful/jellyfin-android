# Gradle
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2

# Sutliff runner resilience (flaky egress on wyse5070): timeouts + retries so
# dependency fetches fail fast and retry instead of hanging forever.
org.gradle.internal.http.connectionTimeout=30000
org.gradle.internal.http.socketTimeout=30000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=1000

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default
